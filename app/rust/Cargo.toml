[package]
name = "player_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Motor de áudio do player: streaming com cache, decodificação, 2 decks, mixer e (futuro) AutoMix DJ"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# Analisador do servidor (coordenador + trabalhadores + painel): fora do app.
# cargo build --release --features analyzer-server --bin bk-analyzer
[[bin]]
name = "bk-analyzer"
path = "src/bin/bk_analyzer/main.rs"
required-features = ["analyzer-server"]

[[bin]]
name = "bk-portal"
path = "src/bin/bk_portal/main.rs"
required-features = ["portal-server"]

[features]
analyzer-server = ["dep:tiny_http", "dep:md-5", "dep:flate2"]
# Portal: um endereço só para o Navidrome e a análise, fora do app.
# cargo build --release --features portal-server --bin bk-portal
portal-server = ["dep:tiny_http"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1.0"
# Trace e debug somem do build de release, em todas as bibliotecas (o Cargo
# unifica as features do `log`). O flutter_rust_bridge liga o logger do
# Android em Trace por padrão, e nesse nível o ureq despeja cada byte de cada
# resposta HTTP em hexadecimal no logcat: tocar música consumia 4 a 6 núcleos
# do celular só formatando e escrevendo log. Cortar na compilação zera até o
# custo de formatar.
log = { version = "0.4", features = ["release_max_level_info"] }
parking_lot = "0.12"
rtrb = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac", "alac", "flac", "mp3", "pcm", "vorbis", "adpcm",
    "isomp4", "mkv", "ogg", "wav", "aiff", "caf",
    "id3v1", "id3v2", "ape",
] }
cpal = "0.18.2"
rubato = { version = "5.0", default-features = false }
audioadapter-buffers = "5.2"
ureq = "3.4"
beat-this = { version = "1.0.0", default-features = false }
signalsmith-stretch = "0.1.3"
ebur128 = "0.1.10"
rustfft = "6.4"
sha2 = "0.10"
# Assina o anúncio do portal (o app só confere; a chave fica no servidor).
ed25519-dalek = "3.0"
rayon = "1.10"
tiny_http = { version = "0.12", optional = true }
md-5 = { version = "0.10", optional = true }
flate2 = { version = "1.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
# Player do Bluetooth (AVRCP) direto no BlueZ; mesma versão que o notify-rust usa.
zbus = "5.19"

[target.'cfg(target_os = "android")'.dependencies]
# O cpal (AAudio) usa a JVM e o Context do app pelo ndk-context; o app
# entrega os dois pelo JNI na inicialização (ver src/android.rs).
ndk-context = "0.1.1"
jni-sys = "0.3.1"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
notify-rust = "4.18"

[dev-dependencies]
hound = "3.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# A análise (rede neural de batidas, FFT) fica lenta demais sem otimização:
# as dependências são sempre compiladas otimizadas, mesmo em debug.
[profile.dev]
opt-level = 1
# Símbolos de debug só com números de linha: o build de debug ficava com ~8 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
